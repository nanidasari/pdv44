eyebrow: ABOUT PIXCEL
title: Built for brands with something to say.
intro: Pixcel Studio is an independent graphic design practice focused on
  creating clear, expressive visual identities with a little more character.
studio_heading: Strategy in one hand. Play in the other.
paragraph_1: We believe the strongest visual identities sit at the intersection
  of clarity and surprise. We keep the process collaborative, the systems
  practical and the final work full of personality.
paragraph_2: Our work spans identity, packaging and social content for founders
  and teams who want their brand to look as ambitious as the idea behind it.
founder_name: Isaac Dasari
founder_role: Founder & Creative Director
founder_bio: Creative direction, brand systems and a belief that design should
  feel as good as it looks.
